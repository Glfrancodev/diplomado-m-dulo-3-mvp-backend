# ============================================================================
# Provisioning de dashboards — carga los .json de esta carpeta al arrancar.
# ============================================================================
apiVersion: 1

providers:
  - name: 'Phoenix Monitoring'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
